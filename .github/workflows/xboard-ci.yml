name: Xboard CI

on:
  push:
    branches:
      - main
      - xboard-dev
      - 'wip/**'
  pull_request:
permissions:
  contents: read

concurrency:
  group: xboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build node
    if: github.repository == 'FengYuchen1314/node'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine change range
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
            head="$GITHUB_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache-dependency-path: tools/mita-control/go.sum

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check changed-file formatting
        shell: bash
        run: |
          mapfile -d '' -t changed_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "${{ steps.changes.outputs.base }}" \
              "${{ steps.changes.outputs.head }}" -- \
              '*.css' '*.js' '*.json' '*.md' \
              '*.ts' '*.tsx' '*.yaml' '*.yml'
          )
          if ((${#changed_files[@]})); then
            npx oxfmt --check "${changed_files[@]}"
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          npm test
          node --test scripts/probe-camouflage-domains.test.mjs

      - name: Test Mita control helper
        working-directory: tools/mita-control
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go test ./...
          go vet ./...

      - name: Type-check
        run: npm run typecheck

      - name: Test Linux Agent lifecycle with real Mieru processes
        shell: bash
        run: |
          cd tools/mita-control
          go build -mod=readonly -o "$RUNNER_TEMP/rw-mita-control" .
          go build -mod=readonly -o "$RUNNER_TEMP/rw-mita-daemon" ./daemon
          cd ../..
          RW_MITA_INTEGRATION=1 \
          RW_MITA_TEST_HELPER="$RUNNER_TEMP/rw-mita-control" \
          RW_MITA_TEST_DAEMON="$RUNNER_TEMP/rw-mita-daemon" \
          npx tsx --test src/modules/mieru/mieru-runtime.linux.test.ts

      - name: Build
        run: npm run build

      - name: Test shared-443 edge against HAProxy and Caddy
        run: RW_EDGE_INTEGRATION=1 npx tsx --test src/modules/edge/edge.linux.test.ts

      - name: Verify AnyTLS ShadowTLS confidentiality with native Mihomo
        env:
          RW_ANYTLS_EXPORT_DIR: ${{ runner.temp }}/anytls-security-proof
        run: bash scripts/test-anytls-security.sh

      - name: Package portable AnyTLS security proof (no private keys)
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/anytls-security-proof/SOURCE_COMMIT"
          tar --owner=0 --group=0 --numeric-owner -czf anytls-security-proof.tar.gz -C "$RUNNER_TEMP/anytls-security-proof" .
          sha256sum anytls-security-proof.tar.gz > anytls-security-proof.tar.gz.sha256

      - name: Upload portable AnyTLS security proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anytls-security-proof-${{ github.sha }}
          path: |
            anytls-security-proof.tar.gz
            anytls-security-proof.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
