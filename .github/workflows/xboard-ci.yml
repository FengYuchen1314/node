name: Xboard CI

on:
  push:
    branches:
      - main
      - xboard-dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build node
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check formatting and lint
        run: npm run check

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
