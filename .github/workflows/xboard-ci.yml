name: Xboard CI

on:
  push:
    branches:
      - main
      - xboard-dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build node
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check changed-file formatting
        shell: bash
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.event.repository.default_branch }}...HEAD" -- \
              '*.css' '*.js' '*.json' '*.md' \
              '*.ts' '*.tsx' '*.yaml' '*.yml'
          )
          if ((${#changed_files[@]})); then
            npx oxfmt --check "${changed_files[@]}"
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
