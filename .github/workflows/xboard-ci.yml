name: Xboard CI

on:
  push:
    branches:
      - main
      - xboard-dev
  pull_request:
permissions:
  contents: read

concurrency:
  group: xboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build node
    if: github.repository == 'FengYuchen1314/node'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine change range
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
            head="$GITHUB_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache-dependency-path: tools/mita-control/go.sum

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check changed-file formatting
        shell: bash
        run: |
          mapfile -d '' -t changed_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "${{ steps.changes.outputs.base }}" \
              "${{ steps.changes.outputs.head }}" -- \
              '*.css' '*.js' '*.json' '*.md' \
              '*.ts' '*.tsx' '*.yaml' '*.yml'
          )
          if ((${#changed_files[@]})); then
            npx oxfmt --check "${changed_files[@]}"
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test Mita control helper
        working-directory: tools/mita-control
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go test ./...
          go vet ./...

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
