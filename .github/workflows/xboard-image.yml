name: Build Xboard Node Image

on:
  push:
    branches:
      - xboard-dev
permissions:
  contents: read
  packages: write

concurrency:
  group: xboard-node-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/fengyuchen1314/node

jobs:
  validate:
    name: Validate node before publishing
    if: github.repository == 'FengYuchen1314/node' && github.ref == 'refs/heads/xboard-dev'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check changed-file formatting
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$BEFORE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          mapfile -d '' -t changed_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "$base" "$GITHUB_SHA" -- \
              '*.css' '*.js' '*.json' '*.md' \
              '*.ts' '*.tsx' '*.yaml' '*.yml'
          )
          if ((${#changed_files[@]})); then
            npx oxfmt --check "${changed_files[@]}"
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  build:
    name: Build and publish test image
    if: github.repository == 'FengYuchen1314/node' && github.ref == 'refs/heads/xboard-dev'
    needs: validate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:xboard-dev
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
